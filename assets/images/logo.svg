  <!-- Tagline: Your Smile is Important to us -->
  <text x="137" y="68" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#64748b" letter-spacing="0.3">Your Smile is Important to us</text>
</svg>