    <text x="135" y="44" font-weight="600" fill="#1e293b">UMAR </text>
    <text x="256" y="44" font-weight="400" fill="#94a3b8">DENTAL </text>
    <text x="408" y="44" font-weight="600" fill="#1e293b">CLINIC</text>
